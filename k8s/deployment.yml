apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-orch-svc
  labels:
    app: community-orch-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: community-orch-svc
  template:
    metadata:
      labels:
        app: community-orch-svc
    spec:
      containers:
        - name: community-orch-svc
          image: localhost:5050/community-orch-svc
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
              name: orch-svc-port
        - name: orchestration-envoy-sidecar
          image: localhost:5050/orch-envoy-sidecar-proxy
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: envoy-in-port
            - containerPort: 9901
              name: envoy-adm-port
---
apiVersion: v1
kind: Service
metadata:
  name: community-orch-svc
spec:
  type: NodePort
  selector:
    app: community-orch-svc
  ports:
  # Service only exposes the Envoy container
    - name: orchestration-envoy-sidecar-port
      protocol: TCP
      port: 80
      targetPort: envoy-in-port
      nodePort: 32000



